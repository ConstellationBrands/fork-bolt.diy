# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.
name: Create and publish a Docker image
on:
  push:
    branches: [ cbi-main, feature_s3_upload ]
  workflow_dispatch:
env:
  APP_NAME: fork-bolt-diy
  REGISTRY: ghcr.io/constellationbrands
  LOCAL_REGISTRY: localhost:5000
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    permissions:
      contents: read
      packages: write
    outputs:
      version_tag: ${{ steps.version_tag.outputs.VERSION_TAG }}
      deploy_path: ${{ steps.deploy_folder.outputs.deploy_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine tag version
        id: version_timestamp
        run: |
          version="${REF#refs/heads/}-$(git rev-parse --short=7 HEAD)"
          echo "VERSION=${version}" >> $GITHUB_OUTPUT
          echo "::notice::Determined tag version is '${version}'."
        env:
          REF: ${{ github.ref }}
      - name: Replace tag version slashes with dashes
        id: version_tag
        run: |
          version_tag="$(echo ${{ steps.version_timestamp.outputs.VERSION }} | sed 's,/,--,g')"
          echo "VERSION_TAG=${version_tag}" >> $GITHUB_OUTPUT
          echo "::notice::Formatted tag version is '${version_tag}'."
      - name: Set image references
        run: |
          echo "IMAGE_REF=${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ steps.version_tag.outputs.VERSION_TAG }}" >> $GITHUB_ENV
          echo "LOCAL_IMAGE_REF=${{ env.LOCAL_REGISTRY }}/${{ env.APP_NAME }}:${{ steps.version_tag.outputs.VERSION_TAG }}" >> $GITHUB_ENV
      - name: Build and push Docker image to local registry (pre-patch)
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          target: bolt-ai-production
          build-args: |
            VITE_ORGANIZATION_NAME=ConstellationBrands
          tags: ${{ env.LOCAL_IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate vulnerability report (JSON for Copa)
        id: trivy_report
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE_REF }}
          format: json
          output: report.json
          exit-code: 1
          scanners: vuln
          vuln-type: os
          ignore-unfixed: true
          skip-setup-trivy: false

      - name: Install Copa
        if: steps.trivy_report.outcome == 'failure'
        run: |
          COPA_VERSION=v0.14.2
          curl -sL https://github.com/project-copacetic/copacetic/releases/download/${COPA_VERSION}/copa_${COPA_VERSION#v}_linux_amd64.tar.gz \
            | tar -xz copa
          sudo mv copa /usr/local/bin/copa

      - name: Start buildkitd
        if: steps.trivy_report.outcome == 'failure'
        run: docker run -d --name buildkitd --privileged --network host moby/buildkit:latest

      - name: Patch image with Copa
        if: steps.trivy_report.outcome == 'failure'
        run: |
          copa patch \
            -r report.json \
            -i ${{ env.LOCAL_IMAGE_REF }} \
            -t ${{ steps.version_tag.outputs.VERSION_TAG }} \
            --addr docker-container://buildkitd

      - name: Push patched image to GHCR
        if: steps.trivy_report.outcome == 'failure'
        run: |
          docker tag ${{ env.LOCAL_IMAGE_REF }} ${{ env.IMAGE_REF }}
          docker push ${{ env.IMAGE_REF }}

      - name: Push unpatched image to GHCR
        if: steps.trivy_report.outcome != 'failure'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_REF }} \
            ${{ env.LOCAL_IMAGE_REF }}
